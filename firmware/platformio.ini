; PlatformIO Configuration for Soil Moisture Monitoring System
; Board: ESP8266 (NodeMCU / Wemos D1 Mini)
;
; Two environments:
;   esp8266     — USB flashing (default):  pio run -e esp8266 --target upload
;   esp8266-ota — over-the-air flashing:   pio run -e esp8266-ota --target upload --upload-port <sensor-ip>

[common]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^6.21.3
    tzapu/WiFiManager@^0.16.0
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
build_flags =
    -DSERIAL_BAUD=115200

[env:esp8266]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
upload_speed = 921600
upload_protocol = esptool
; upload_port = /dev/cu.usbserial-0001  ; Auto-detect if commented out

[env:esp8266-ota]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
upload_protocol = espota
; The password used to AUTHENTICATE the upload is the one the board is currently
; RUNNING, which during a rotation is not the one being compiled in. Keep the two
; separate: OTA_AUTH_PASSWORD authenticates, OTA_PASSWORD (secrets.h) gets built
; into the new firmware. flash-fleet.sh exports both; outside a rotation they match.
upload_flags =
    --auth=${sysenv.OTA_AUTH_PASSWORD}
