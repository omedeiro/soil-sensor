; PlatformIO Configuration for Soil Moisture Monitoring System
; Board: ESP8266 (NodeMCU / Wemos D1 Mini)

[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^6.21.3
    tzapu/WiFiManager@^0.16.0
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
upload_speed = 921600

; OTA settings (commented out for USB upload)
; upload_protocol = espota
; upload_flags =
;     --auth=soilmon2026

; USB upload settings (enabled)
upload_protocol = esptool
; upload_port = /dev/cu.usbserial-0001  ; Auto-detect if commented out

; Build flags
build_flags =
    -DSERIAL_BAUD=115200
